# Node.js 24-compatible GitHub Pages deployment
name: Deploy Watched Logger (Node 24)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Allow Git metadata reads in the browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Set up Python for the Odoo deployment checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate version from Git history
        run: node scripts/build-info.mjs

      - name: Check application behavior
        id: application_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs 2>&1 | tee /tmp/watchlog-tests.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            { echo 'failure_summary<<WATCHLOG_FAILURE'; tail -n 35 /tmp/watchlog-tests.log; echo WATCHLOG_FAILURE; } >> "$GITHUB_OUTPUT"
          fi
          exit "$result"

      - name: Check mobile browser flows
        id: browser_tests
        continue-on-error: true
        shell: bash
        env:
          BROWSER_ENGINES: all
        run: |
          set +e
          npm run test:browser 2>&1 | tee /tmp/watchlog-browser-tests.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            { echo 'failure_summary<<WATCHLOG_FAILURE'; tail -n 35 /tmp/watchlog-browser-tests.log; echo WATCHLOG_FAILURE; } >> "$GITHUB_OUTPUT"
          fi
          exit "$result"

      - name: Stop before deployment when checks fail
        if: steps.application_tests.outcome == 'failure' || steps.browser_tests.outcome == 'failure'
        run: exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage runtime site
        run: |
          mkdir -p _site
          cp index.html build-info.js library-gallery.js library-gallery.css manifest.webmanifest sw.js asset-manifest.json _site/
          cp -R assets _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify owner of this workflow result
        if: always()
        env:
          WATCHLOG_SOURCE_SHA: ${{ github.sha }}
          WATCHLOG_SOURCE_RUN_NUMBER: ${{ github.run_number }}
          WATCHLOG_SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          WATCHLOG_FAILURE_SUMMARY: ${{ steps.application_tests.outputs.failure_summary || steps.browser_tests.outputs.failure_summary }}
          WATCHLOG_SOURCE_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: workflow_run
          WATCHLOG_STATUS: ${{ job.status }}
          WATCHLOG_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/notify-deployment.mjs
